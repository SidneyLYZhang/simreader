[package]
name = "simreader"
version = "0.1.0"
edition = "2024"
description = "A Simple Reader for data files and txt files in Rust."
license = "MIT"
authors = ["Sidney Zhang <zly@lyzhang.me>"]
repository = "https://github.com/SidneyLYZhang/simreader"


[dependencies]
calamine = { version = "0.34.0", features = ["chrono"] }
clap = { version = "4.6.1", features = ["derive"] }
polars = { version = "0.53.0", features = ["csv","json","parquet","lazy","ipc"] }
anyhow = "1.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
toml = "0.8"
dirs = "5"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-trait = "0.1"