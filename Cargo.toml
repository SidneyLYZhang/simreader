[package]
name = "simreader"
version = "0.4.0"
edition = "2024"
description = "A Simple Reader for data files and txt files in Rust."
license = "MIT"
authors = ["Sidney Zhang <zly@lyzhang.me>"]
repository = "https://github.com/SidneyLYZhang/simreader"
categories = ["command-line-interface"]

[profile.dev]
opt-level = 1 
debug = true

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 2
panic = "abort"
strip = true
debug = false

[dependencies]
calamine = { version = "0.34.0", features = ["chrono"] }
clap = { version = "4.6.1", features = ["derive"] }
polars = { version = "0.53.0", features = ["csv","json","parquet","lazy","ipc"] }
anyhow = "1.0"
keyring = "3"
toml = "0.8"
dirs = "5"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-trait = "0.1"
csv = "1"
lazy_static = "1"
regex = "1"
unicode-width = "0.2"

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[lib]
name = "simreader"
path = "src/lib.rs"

[[bin]]
name = "simreader"
path = "src/main.rs"
